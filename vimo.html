<style>
/* Layout: zwarte kopbalk; 16:9-podium met de 3D-mascotte en een Motion Cube (draaibaar), rechts het bedieningspaneel. */
:root{
  --geel:#fbb900; --zwart:#1e1e1e; --wit:#ffffff; --grijs:#f4f4f2; --antraciet:#2e3033;
  --bg:#ffffff; --fg:#1e1e1e; --muted:#5f5d58; --panel:#f4f4f2; --line:#e3e2de; --btn-bg:#ffffff;
  --font:"Neue Montreal",Arial,sans-serif;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){--bg:#161616;--fg:#f2f2f0;--muted:#aaa8a3;--panel:#222221;--line:#333331;--btn-bg:#2a2a29;color-scheme:dark}}
:root[data-theme="dark"]{--bg:#161616;--fg:#f2f2f0;--muted:#aaa8a3;--panel:#222221;--line:#333331;--btn-bg:#2a2a29;color-scheme:dark}
html{font-size:clamp(13px,1.6vh,20px)}
body{background:var(--bg);color:var(--fg);font-family:var(--font);letter-spacing:.03em;line-height:1.5}
.wrap{max-width:1500px;margin:0 auto;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
header{background:var(--zwart);color:var(--wit)}
header .wrap{display:flex;align-items:center;gap:1rem;padding-block:.9rem;flex-wrap:wrap}
header .logo{height:1.6rem;width:auto}
header .str{height:1.5rem;width:auto}
header .sep{width:1px;height:1.6rem;background:#4a4a48}
header h1{margin:0;font-weight:700;font-size:1.3rem;line-height:1.2}
header h1 span{color:var(--geel)}
main{padding-block:1.2rem 2rem}
.top{display:grid;grid-template-columns:minmax(0,1fr) 21rem;gap:1.2rem;align-items:start}
@media (max-width:900px){.top{grid-template-columns:minmax(0,1fr)}}
.stage{position:relative;border-radius:1.4rem;overflow:hidden;background:linear-gradient(180deg,#dcf1f9 0%,#eef8fc 55%,#f7fbfc 100%);aspect-ratio:16/9;max-width:100%;touch-action:none}
.stage canvas{display:block;width:100%;height:100%;cursor:grab}
.stage:fullscreen{border-radius:0;aspect-ratio:auto;width:100vw;height:100vh}
.stage{container-type:inline-size}
.bubble{position:absolute;left:0;top:0;background:#fff;color:#1e1e1e;border:2px solid #1e1e1e;border-radius:.7em;padding:.4em .8em;font-family:var(--font);font-weight:700;font-size:clamp(11px,2.1cqw,24px);line-height:1.2;white-space:nowrap;pointer-events:none;letter-spacing:.03em}
.bubble::after{content:"";position:absolute;width:.6em;height:.6em;background:#fff;border-right:2px solid #1e1e1e;border-bottom:2px solid #1e1e1e}
.bubble.up::after{left:var(--tx,50%);bottom:-.36em;transform:translateX(-50%) rotate(45deg)}
.bubble.left::after{right:-.36em;top:1em;transform:rotate(-45deg)}
.bubble.right::after{left:-.36em;top:1em;transform:rotate(135deg)}
.stagewrap{position:relative;min-width:0}
.tools{position:absolute;left:.8rem;right:.8rem;bottom:.8rem;display:flex;gap:.4rem;flex-wrap:wrap;justify-content:flex-end;align-items:center;pointer-events:none}
.tools button{pointer-events:auto}
@media (max-width:700px){.tools{position:static;margin-top:.6rem;justify-content:flex-start}.tools .hint{display:none}}
.tools button{font:700 .8rem var(--font);letter-spacing:.03em;background:rgba(30,30,30,.82);color:#fff;border:0;border-radius:.6rem;padding:.45rem .8rem;cursor:pointer}
.tools button[aria-pressed="true"]{background:var(--geel);color:#1e1e1e}
.hint{margin-right:auto;font-size:.8rem;color:#5f5d58}
.panel{background:var(--panel);border-radius:1.4rem;padding:1.2rem;display:flex;flex-direction:column;gap:1.1rem;min-width:0}
.lbl{font-size:.8rem;color:var(--muted);margin:0 0 .45rem}
.nm{margin:0;font-size:1.25rem}.nm b{font-weight:700}
.chips{display:flex;flex-wrap:wrap;gap:.4rem}
.chip{font:400 .9rem var(--font);letter-spacing:.03em;border:1.5px solid var(--fg);background:var(--btn-bg);color:var(--fg);border-radius:999px;padding:.3rem .8rem;cursor:pointer}
.chip[aria-pressed="true"]{background:var(--geel);border-color:var(--geel);color:#1e1e1e;font-weight:700}
.moves{display:grid;grid-template-columns:1fr 1fr;gap:.5rem}
.mv{font:700 .9rem var(--font);letter-spacing:.03em;text-align:left;border:1.5px solid var(--line);background:var(--btn-bg);color:var(--fg);border-radius:.8rem;padding:.6rem .7rem;cursor:pointer;display:flex;align-items:center;gap:.5rem;min-width:0}
.mv i{width:.55rem;height:.55rem;border-radius:50%;flex:none;background:var(--line)}
.mv:last-child:nth-child(odd){grid-column:span 2}
.mv:hover{border-color:var(--fg)}
.mv[aria-pressed="true"]{border-color:var(--geel);box-shadow:inset 0 0 0 1.5px var(--geel)}
.mv[aria-pressed="true"] i{background:var(--geel)}
.ask{display:flex;flex-direction:column;gap:.45rem;margin:0}
.ask .lbl{margin:0}
.askrow{display:flex;gap:.4rem}
.field{position:relative;flex:1;min-width:0;display:flex}
.clr{position:absolute;right:.35rem;top:50%;transform:translateY(-50%);width:1.6rem;height:1.6rem;border-radius:50%;border:0;background:var(--line);color:var(--fg);font:700 1.05rem/1 var(--font);cursor:pointer;display:flex;align-items:center;justify-content:center;padding:0}
.clr:hover{background:var(--fg);color:var(--bg)}
.askrow input{flex:1;min-width:0;font:400 .95rem var(--font);letter-spacing:.03em;padding:.6rem 2.2rem .6rem .75rem;border-radius:.8rem;border:1.5px solid var(--fg);background:var(--btn-bg);color:var(--fg)}
.askrow input:focus-visible{outline:2px solid var(--geel);outline-offset:1px}
.askrow button{font:700 .95rem var(--font);letter-spacing:.03em;background:var(--geel);color:#1e1e1e;border:0;border-radius:.8rem;padding:.6rem .9rem;cursor:pointer;white-space:nowrap}
.askrow button[data-busy="1"]{background:var(--zwart);color:#fff}
.ex{display:flex;flex-wrap:wrap;gap:.35rem}
.ex button{font:400 .78rem var(--font);letter-spacing:.03em;border:1px solid var(--line);background:var(--btn-bg);color:var(--fg);border-radius:999px;padding:.22rem .6rem;cursor:pointer}
.ex button:hover{border-color:var(--fg)}
.status{margin:0;font-size:.8rem;color:var(--muted);min-height:1.2em}
.cubebox,.game{display:flex;flex-direction:column;gap:.45rem}
.cubebox .lbl,.game .lbl{margin:0}
.throw{font:700 1rem var(--font);letter-spacing:.03em;background:var(--zwart);color:#fff;border:0;border-radius:.8rem;padding:.75rem 1rem;cursor:pointer;display:flex;align-items:center;justify-content:center;gap:.5rem}
.throw::before{content:"";width:1rem;height:1rem;border-radius:.2rem;background:var(--geel);transform:rotate(12deg)}
.throw[aria-pressed="true"]{outline:2px solid var(--geel)}
.poses{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:.35rem}
.ps{font:700 .78rem var(--font);letter-spacing:.02em;line-height:1.15;border:1.5px solid var(--line);background:var(--btn-bg);color:var(--fg);border-radius:.6rem;padding:.45rem .35rem;cursor:pointer;min-width:0;text-align:center}
.ps:hover{border-color:var(--fg)}
.ps[aria-pressed="true"]{border-color:var(--geel);box-shadow:inset 0 0 0 1.5px var(--geel)}
.seg{display:grid;grid-auto-flow:column;grid-auto-columns:minmax(0,1fr);background:var(--btn-bg);border:1.5px solid var(--line);border-radius:.8rem;padding:.2rem;gap:.2rem}
.seg button{border:0;background:transparent;color:var(--fg);font:700 .85rem var(--font);letter-spacing:.03em;padding:.4rem;border-radius:.6rem;cursor:pointer}
.seg button[aria-pressed="true"]{background:var(--zwart);color:#fff}
.check{display:flex;gap:.5rem;align-items:flex-start;font-size:.85rem}
.check input{margin-top:.15rem;accent-color:#1e1e1e}
.demo.alt{background:transparent;border:1.5px solid var(--fg);color:var(--fg)}
.demo.alt[aria-pressed="true"]{background:var(--zwart);color:#fff}
.stagewrap:fullscreen{background:#f7fbfc;display:flex;flex-direction:column;justify-content:center;padding:1rem}
.stagewrap:fullscreen .stage{aspect-ratio:auto;flex:1;border-radius:1rem}
.demo{font:700 .95rem var(--font);letter-spacing:.03em;background:var(--geel);color:#1e1e1e;border:0;border-radius:.8rem;padding:.75rem 1rem;cursor:pointer}
.demo[aria-pressed="true"]{background:var(--zwart);color:#fff;outline:2px solid var(--geel)}
button:focus-visible{outline:2px solid var(--fg);outline-offset:2px}
.facts{margin:0;padding:.8rem 0 0;list-style:none;font-size:.82rem;color:var(--muted);display:flex;flex-direction:column;gap:.25rem;border-top:1px solid var(--line)}
.facts b{color:var(--fg);font-weight:700}
.facts a{color:var(--fg)}
.err{position:absolute;inset:0;display:flex;align-items:center;justify-content:center;text-align:center;padding:2rem;color:#1e1e1e;font-size:1rem}
footer{border-top:1px solid var(--line)}
footer .wrap{display:flex;align-items:center;gap:.6rem;padding-block:1rem;color:var(--muted);font-size:.9rem}
footer img{height:.9rem;width:auto}
</style>

<script type="module">

/* ---------- camera ---------- */
const orbitB = $("orbit");
const setOrbit = on => { v.setOrbit(on); orbitB.setAttribute("aria-pressed", String(on)); };
orbitB.addEventListener("click", () => setOrbit(orbitB.getAttribute("aria-pressed") !== "true"));
$("front").addEventListener("click", () => { setOrbit(false); v.view(0); });
$("side").addEventListener("click", () => { setOrbit(false); v.view(-Math.PI * .4); });
$("full").addEventListener("click", () => { try { const p = document.fullscreenElement ? document.exitFullscreen() : $("stagewrap").requestFullscreen(); p && p.catch && p.catch(() => {}); } catch (e) {} });

/* ---------- spel: Vimo zegt ---------- */
let game = null, tempo = 8;
const gameB = $("game");
$("tempo").addEventListener("click", e => { const b = e.target.closest("[data-s]"); if (!b) return; tempo = +b.dataset.s; document.querySelectorAll("#tempo button").forEach(x => x.setAttribute("aria-pressed", String(x === b))); });
function gameTick() {
  if (!game) return;
  let k; do { k = POSES[Math.floor(Math.random() * POSES.length)][0]; } while (k === game.last); game.last = k;
  const simon = $("simon").checked, says = !simon || Math.random() > .3;
  game.n++; $("gameStatus").textContent = `Ronde ${game.n}` + (simon && !says ? " · let op: Vimo zei het niet!" : "");
  v.sequence([{ move: "pose:" + k, text: (simon && says ? "Vimo zegt: " : "") + LABEL[k] + "!" }], () => { if (game) game.t = setTimeout(gameTick, tempo * 1000); });
}
function setGame(on) {
  if (on) { stopAll(); game = { n: 0, last: null, t: 0 }; gameB.textContent = "Stop het spel"; gameB.setAttribute("aria-pressed", "true"); gameTick(); }
  else { if (game) clearTimeout(game.t); game = null; gameB.textContent = "Start Vimo zegt"; gameB.setAttribute("aria-pressed", "false"); $("gameStatus").textContent = ""; }
}
gameB.addEventListener("click", () => { const on = !game; setGame(on); if (!on) v.stop(); });

/* ---------- beursmodus ---------- */
let demo = false;
const demoB = $("demo");
const DEMO = [{ move: "hoi" }, { move: "gooien" }, { move: "pose:staan-op" }, { move: "springen" }, { move: "pose:erachter-staan" }, { move: "pose:zitten-op" }, { move: "knieen" }, { move: "pose:boven-hoofd" }, { move: "gooien" }, { move: "balans" }, { move: "pose:ernaast-staan" }, { move: "draaien" }, { move: "pose:liggen-op" }, { move: "kubus" }];
function demoLoop() { if (demo) v.sequence(DEMO, () => setTimeout(demoLoop, 1200)); }
function setDemo(on) { demo = on; demoB.setAttribute("aria-pressed", String(on)); demoB.textContent = on ? "Beursmodus staat aan (klik om te stoppen)" : "Beursmodus: alles om de beurt"; if (on) { setOrbit(true); demoLoop(); } }
demoB.addEventListener("click", () => { const on = !demo; stopAll(); setDemo(on); if (!on) { setOrbit(false); v.stop(); } });

function stopAll() { if (demo) setDemo(false); if (game) setGame(false); if (busy) { ctl?.abort(); setBusy(0); } }

/* ---------- opdrachten (AI via Claude, met eenvoudige terugval) ---------- */
const ALLOWED = {
  hoi: "zwaaien en hallo zeggen", wijzen: "naar iets wijzen", springen: "twee keer omhoog springen en juichen", knieen: "drie keer door de knieën (squat) en tellen",
  balans: "op één been balanceren", draaien: "een rondje om zijn as draaien", kubus: "op de Motion Cube springen, juichen en er weer af springen",
  gooien: "de Motion Cube oppakken, boven zijn hoofd tillen en gooien als dobbelsteen; hij zegt daarna zelf welke kleur boven ligt (geef hier geen tekst)",
  ...Object.fromEntries(POSES.map(([k, t]) => ["pose:" + k, "houding met de Motion Cube: " + t.toLowerCase() + " (blijft zo staan)"]))
};
const cmd = $("cmd"), go = $("go"), statusEl = $("status"), clr = $("clr");
const EXAMPLES = ["Gooi de kubus", "Ga achter de kubus staan", "Spring drie keer en juich dan", "Til de kubus boven je hoofd", "Ga op de kubus zitten"];
EXAMPLES.forEach(t => { const b = document.createElement("button"); b.type = "button"; b.textContent = t; b.addEventListener("click", () => run(t)); $("ex").appendChild(b); });
let sample = null, aiOff = false, ctl = null, busy = 0;
try { const C = window.claude || (() => { try { return window.parent !== window && window.parent.claude; } catch (e) { return null; } })(); C?.use?.("sample")?.then(s => { sample = s; }, () => {}); } catch (e) {}
function setBusy(b) { busy = b; go.dataset.busy = b ? "1" : ""; go.textContent = b ? "Stop" : "Doe maar!"; }
const WORDS = { een: 1, "één": 1, twee: 2, drie: 3, vier: 4, vijf: 5 };
function simpleParse(t) {
  t = t.toLowerCase(); const out = [];
  const KEYS = [["gooien", /gooi|dobbel|werp/], ["pose:erachter-zitten", /achter.*zit|zit.*achter/], ["pose:zitten-op", /zit|zitten/], ["pose:liggen-op", /lig|liggen/],
    ["pose:boven-hoofd", /boven.*hoofd|optil|til .*op|tillen/], ["pose:voor-je-houden", /vasthoud|voor je houd|houd.*vast/], ["pose:erachter-staan", /achter/],
    ["pose:ervoor-staan", /ervoor|voor de kubus|voor de cube/], ["pose:ernaast-staan", /naast/], ["pose:staan-op", /staan op|op de kubus staan|klim/],
    ["kubus", /kubus|cube|erop/], ["hoi", /hoi|hallo|zwaai|stel je voor|begroet/], ["wijzen", /wijs|wijzen|kijk/], ["knieen", /knie|squat|hurk/],
    ["balans", /balan|één been|een been|evenwicht/], ["draaien", /draai|rondje|spin/], ["springen", /spring|sprong|juich|hup/]];
  for (const part of t.split(/,| en | daarna | dan |\./)) {
    for (const [k, re] of KEYS) if (re.test(part)) {
      const m = part.match(/(\d+|een|één|twee|drie|vier|vijf)\s*(keer|maal|x)/);
      const n = Math.min(5, m ? (WORDS[m[1]] || parseInt(m[1]) || 1) : 1);
      for (let i = 0; i < n; i++) out.push({ move: k }); break;
    }
  }
  return out.slice(0, 8);
}
const prompt = t => `Je bestuurt Vimo, de vrolijke mascotte van Vanerum (de V uit het logo, met armpjes en beentjes) die naast een Motion Cube staat. Vimo is een speels maatje voor kinderen van groep 1 t/m 8 en praat kort, vrolijk en eenvoudig Nederlands, met "je".

Vimo kan alleen deze bewegingen:
${Object.entries(ALLOWED).map(([k, d]) => `- "${k}": ${d}`).join("\n")}

Zet de opdracht hieronder om in 1 tot 8 stappen. Elke stap is één beweging uit de lijst plus wat Vimo erbij zegt (hooguit 35 tekens). Wil iemand iets herhalen, zet de beweging dan meerdere keren achter elkaar. Is het een vraag of iets wat Vimo niet kan, kies dan passende bewegingen (bijv. "hoi") en laat Vimo kort antwoorden of vriendelijk zeggen wat hij wel kan. Ongepaste opdrachten: één stap "hoi" met een vriendelijke tekst om iets anders te vragen.

Antwoord met alleen JSON in deze vorm:
{"stappen":[{"beweging":"gooien","tekst":""},{"beweging":"pose:staan-op","tekst":"Kijk, ik sta erop!"}]}

Opdracht: ${t}`;
async function run(t) {
  if (busy) { stopAll(); v.stop(); return; }
  t = (t || "").trim(); if (!t) return;
  cmd.value = ""; updClr(); stopAll(); statusEl.textContent = "";
  let steps = null;
  if (sample && !aiOff) {
    setBusy(1); statusEl.textContent = "Vimo denkt na…"; v.play("denken");
    ctl = new AbortController();
    try {
      const r = await sample.json(prompt(t), { modelTier: "quick", signal: ctl.signal });
      steps = (Array.isArray(r?.stappen) ? r.stappen : []).filter(x => ALLOWED[x?.beweging]).slice(0, 8)
        .map(x => ({ move: x.beweging, text: x.beweging === "gooien" ? "" : String(x.tekst || "").slice(0, 48) }));
      if (!steps.length) steps = null;
    } catch (e) {
      if (e?.code === "cancelled") { statusEl.textContent = "Gestopt."; setBusy(0); v.stop(); return; }
      if (["not_granted", "sampling_disabled", "not_declared", "capability_disabled", "capability_removed"].includes(e?.code)) aiOff = true;
      statusEl.textContent = e?.code === "rate_limited" ? "Vimo heeft even pauze nodig; nu doet hij wat hij herkent." : "AI is nu niet beschikbaar; Vimo doet wat hij in je zin herkent.";
    }
  }
  if (!steps) steps = simpleParse(t);
  if (!steps.length) { setBusy(0); v.play("hoi", "Dat ken ik nog niet. Zeg: gooi, spring of zit!"); statusEl.textContent = "Probeer woorden als gooi, spring, zwaai, erachter, ervoor, zit, lig of boven je hoofd."; return; }
  if (!statusEl.textContent || busy) statusEl.textContent = "Vimo doet: " + steps.map(x => (LABEL[x.move.slice(5)] || (MOVES.find(m => m[0] === x.move) || [, x.move === "gooien" ? "gooien" : x.move])[1]).toLowerCase()).join(", ");
  setBusy(2); v.sequence(steps, () => setBusy(0));
}
function updClr() { clr.hidden = !cmd.value; }
cmd.addEventListener("input", updClr);
clr.addEventListener("click", () => { cmd.value = ""; updClr(); cmd.focus(); });
$("ask").addEventListener("submit", e => { e.preventDefault(); run(cmd.value); });
</script>
<script>
setTimeout(()=>{if(!document.querySelector("#stage canvas")){const d=document.createElement("div");d.className="err";d.textContent="De 3D-weergave kon niet laden. Probeer de pagina opnieuw of gebruik een recente versie van Chrome, Edge of Safari.";document.getElementById("stage").appendChild(d);}},6000);
</script>

</body></html>
